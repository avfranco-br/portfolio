site_name: Alexandre Franco | Enterprise Architect & AI Transformation Advisor
site_description: Operational Architecture, Governance Systems, AI Enablement and Sustainable Transformation
site_author: Alexandre Franco
site_url: https://alexandrefranco.dev/

# Repository link — enables "Edit this page" links on every page
repo_url: https://github.com/avfranco-br/portfolio
edit_uri: edit/main/docs/

# Directories to watch for live reloading during `mkdocs serve`
watch:
  - docs
  - overrides
  - scripts

hooks:
  - scripts/mkdocs_hooks.py

# Validation policy — declared in code so it survives anyone forgetting the CLI flag.
# Each sub-option is set to `warn` so the corresponding check emits a warning,
# which `mkdocs build --strict` then promotes to a build failure.
# Valid log levels: 'warn', 'info', 'ignore'. (No 'strict' at this layer.)
validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: info
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn

theme:
  name: material
  custom_dir: overrides
  favicon: assets/images/favicon.png
  logo: assets/images/favicon-source.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    #- toc.integrate
    #- content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - roamlinks
  - social
  - tags
  - blog:
      blog_dir: tech-blog
      post_url_format: "{slug}"

# Cloudflare Web Analytics — cookie-less, privacy-friendly, no consent banner required.
# Replace YOUR_BEACON_TOKEN_HERE in docs/js/cloudflare-insights.js with the real token
# from the Cloudflare dashboard (Website → Analytics → Web Analytics → enable for the
# zone → copy beacon token). Until replaced, the script returns 404 and analytics are
# silently disabled.
extra_javascript:
  - js/cloudflare-insights.js

